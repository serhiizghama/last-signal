<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Last Signal — sliced asset preview</title>
<style>
  body { background: #16100B; color: #E8D9B0; font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
  h1 { color: #D9772F; font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #9a8b6f; margin: 0 0 28px; font-size: 13px; }
  h2 { color: #3F7E75; font-size: 15px; border-bottom: 1px solid #4A3826; padding-bottom: 6px; margin: 32px 0 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .grid { display: flex; flex-wrap: wrap; gap: 14px; }
  .cell { background: #2A211A; border: 1px solid #4A3826; border-radius: 6px; padding: 10px; width: 120px; text-align: center; }
  .cell img { max-width: 96px; max-height: 96px; image-rendering: pixelated; display: block; margin: 0 auto 6px; }
  .cell .id { font-size: 9px; color: #bfae86; word-break: break-all; line-height: 1.3; }
  .cell .dim { font-size: 9px; color: #6d6048; }
  .count { color: #7FD13B; }
</style>
</head>
<body>
<h1>Last Signal — нарезанные спрайты (превью, не игровой экран)</h1>
<p class="sub">Читает <code>/assets/manifest.json</code> напрямую. Временная страница для просмотра, удаляется после проверки. Всего: <span class="count" id="total"></span></p>
<div id="root"></div>
<script>
fetch('/assets/manifest.json').then(r => r.json()).then(items => {
  document.getElementById('total').textContent = items.length;
  const groups = {};
  for (const item of items) {
    const cat = item.id.split('.').slice(0, 2).join('.');
    (groups[cat] ||= []).push(item);
  }
  const root = document.getElementById('root');
  for (const cat of Object.keys(groups).sort()) {
    const h2 = document.createElement('h2');
    h2.textContent = cat + ' (' + groups[cat].length + ')';
    root.appendChild(h2);
    const grid = document.createElement('div');
    grid.className = 'grid';
    for (const item of groups[cat]) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.innerHTML = '<img src="' + item.path + '" loading="lazy">' +
        '<div class="id">' + item.id + '</div>' +
        '<div class="dim">' + item.width + '×' + item.height + '</div>';
      grid.appendChild(cell);
    }
    root.appendChild(grid);
  }
});
</script>
</body>
</html>
